<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Deposit Requests</title>
    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
            padding: 24px;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        h2 {
            margin-top: 0;
            color: #1e293b;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }
        table th, table td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
        }
        table th {
            background-color: #f1f5f9;
            color: #475569;
        }
        .badge {
            background-color: #fef3c7;
            color: #92400e;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 13px;
        }
        .btn-approve {
            background-color: #16a34a;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 6px;
        }
        .btn-reject {
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-approve:hover { background-color: #15803d; }
        .btn-reject:hover { background-color: #b91c1c; }
    </style>
</head>
<body>

<div class="container">
    <h2>পেন্ডিং ডিপোজিট তালিকা (Requests)</h2>
    <table>
        <thead>
            <tr>
                <th>TrxID</th>
                <th>Amount</th>
                <th>User ID / Phone</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="depositTableBody">
            <tr><td colspan="5">ডাটা লোড হচ্ছে...</td></tr>
        </tbody>
    </table>
</div>

  <script>
	const firebaseConfig = {
  	   apiKey: "AIzaSyCU5sOxrPB4uv0IzUhOKL4h5_4HmtmVPYg",
  		authDomain: "rdx-bd-tour.firebaseapp.com",
	    databaseURL: "https://rdx-bd-tour-default-rtdb.asia-southeast1.firebasedatabase.app",
  		projectId: "rdx-bd-tour",
		storageBucket: "rdx-bd-tour.firebasestorage.app",
		messagingSenderId: "421778019485",
		appId: "1:421778019485:web:dad0e0d5e5c2e7fa573074",
		measurementId: "G-R6TSEM5FLR"
	};

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    const tableBody = document.getElementById('depositTableBody');

    // রিয়েলটাইমে রিকোয়েস্ট লিস্ট আনা
    firebase.database().ref('deposit_requests').on('value', (snapshot) => {
        tableBody.innerHTML = '';
        const data = snapshot.val();

        if (!data) {
            tableBody.innerHTML = '<tr><td colspan="5">কোনো পেন্ডিং রিকোয়েস্ট নেই।</td></tr>';
            return;
        }

        let hasPending = false;

        Object.keys(data).forEach((key) => {
            const req = data[key];
            if (req.status === 'pending') {
                hasPending = true;
                const row = `
                    <tr>
                        <td><strong>${req.trxId}</strong></td>
                        <td>৳${req.amount}</td>
                        <td>${req.userPhone !== "N/A" ? req.userPhone : req.userId}</td>
                        <td><span class="badge">Pending</span></td>
                        <td>
                            <button class="btn-approve" onclick="approveRequest('${key}', '${req.userId}', ${req.amount})">Approve</button>
                            <button class="btn-reject" onclick="rejectRequest('${key}')">Reject</button>
                        </td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            }
        });

        if (!hasPending) {
            tableBody.innerHTML = '<tr><td colspan="5">কোনো পেন্ডিং রিকোয়েস্ট নেই।</td></tr>';
        }
    });

    // অনুমোদন বা Approve করা
    function approveRequest(requestId, userId, amount) {
        if (!confirm("আপনি কি নিশ্চিত এই ডিপোজিটটি Approve করতে চান?")) return;

        // ইউজারের ব্যালেন্স বাড়ানো
        const balanceRef = firebase.database().ref(`users/${userId}/depositBalance`);

        balanceRef.transaction((currentBalance) => {
            return (currentBalance || 0) + Number(amount);
        }).then(() => {
            // রিকোয়েস্ট স্ট্যাটাস আপডেট
            firebase.database().ref(`deposit_requests/${requestId}`).update({
                status: "success",
                approvedAt: Date.now()
            });

            // হিস্ট্রি যোগ
            firebase.database().ref(`users/${userId}/transactions`).push({
                type: "Deposit",
                amount: amount,
                status: "Success",
                timestamp: Date.now()
            });

            alert("ডিপোজিট সফলভাবে অনুমোদিত হয়েছে এবং ব্যালেন্স যোগ করা হয়েছে!");
        }).catch((err) => {
            alert("ভুল হয়েছে: " + err.message);
        });
    }

    // বাতিল বা Reject করা
    function rejectRequest(requestId) {
        if (!confirm("আপনি কি নিশ্চিত এই রিকোয়েস্টটি Reject করতে চান?")) return;

        firebase.database().ref(`deposit_requests/${requestId}`).update({
            status: "rejected",
            rejectedAt: Date.now()
        }).then(() => {
            alert("রিকোয়েস্ট বাতিল করা হয়েছে।");
        });
    }
</script>

</body>
</html>
