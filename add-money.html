<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Money</title>
    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            padding: 24px;
        }
        .title {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .notice-box {
            background-color: #eef2ff;
            border: 1px solid #c7d2fe;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            margin-bottom: 20px;
        }
        .notice-box .number {
            font-size: 18px;
            font-weight: bold;
            color: #1e40af;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #374151;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }
        .btn-submit {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-submit:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="title">Add Money</div>

    <div class="notice-box">
        <div>Send Money (Personal Number)</div>
        <div class="number">01854471019</div>
        <small style="color: #6b7280;">Min Deposit: ৳1. Use "Send Money" only.</small>
    </div>

    <div class="form-group">
        <label for="depositAmount">Deposit Amount (৳)</label>
        <input type="number" id="depositAmount" placeholder="টাকার পরিমাণ লিখুন">
    </div>

    <div class="form-group">
        <label for="depositTrxId">Transaction ID (TrxID)</label>
        <input type="text" id="depositTrxId" placeholder="যেমন: DJB6Q6MQL0">
    </div>

    <button class="btn-submit" onclick="submitDepositRequest()">Request Deposit</button>
</div>

  <script>
	const firebaseConfig = {
  	   apiKey: "AIzaSyCU5sOxrPB4uv0IzUhOKL4h5_4HmtmVPYg",
  		authDomain: "rdx-bd-tour.firebaseapp.com",
	    databaseURL: "https://rdx-bd-tour-default-rtdb.asia-southeast1.firebasedatabase.app",
  		projectId: "rdx-bd-tour",
		storageBucket: "rdx-bd-tour.firebasestorage.app",
		messagingSenderId: "421778019485",
		appId: "1:421778019485:web:dad0e0d5e5c2e7fa573074",
		measurementId: "G-R6TSEM5FLR"
	};

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    function submitDepositRequest() {
        const amount = document.getElementById('depositAmount').value.trim();
        const trxId = document.getElementById('depositTrxId').value.trim();
        const currentUser = firebase.auth().currentUser;

        if (!amount || Number(amount) <= 0) {
            alert("সঠিক ডিপোজিট পরিমাণ লিখুন।");
            return;
        }
        if (!trxId) {
            alert("ট্রানজেকশন আইডি (TrxID) লিখুন।");
            return;
        }

        const userId = currentUser ? currentUser.uid : "GUEST_USER";
        const userPhone = currentUser ? (currentUser.phoneNumber || "N/A") : "N/A";

        const requestRef = firebase.database().ref('deposit_requests').push();

        requestRef.set({
            userId: userId,
            userPhone: userPhone,
            amount: Number(amount),
            trxId: trxId.toUpperCase(),
            status: "pending",
            timestamp: Date.now()
        }).then(() => {
            alert("আপনার ডিপোজিট রিকোয়েস্ট জমা হয়েছে! অ্যাডমিন চেক করে অনুমোদন দিলে ব্যালেন্স যুক্ত হবে।");
            document.getElementById('depositAmount').value = '';
            document.getElementById('depositTrxId').value = '';
        }).catch((error) => {
            alert("সমস্যা হয়েছে: " + error.message);
        });
    }
</script>

</body>
</html>
